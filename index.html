<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>銀行轉帳資訊智慧解析與帳號驗證工具</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 min-h-screen text-slate-100 antialiased selection:bg-rose-500 selection:text-white">

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none"></div>

    <div class="max-w-5xl mx-auto px-4 py-10">
        
        <!-- Header -->
        <header class="text-center mb-10">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-rose-600 to-indigo-600 text-white shadow-xl shadow-rose-950/50 mb-4 transform hover:scale-105 transition duration-300">
                <i class="fa-solid fa-file-invoice-dollar text-2xl"></i>
            </div>
            <h1 class="text-3xl font-extrabold text-white tracking-tight">轉帳資訊智慧解析與驗證工具</h1>
            <p class="mt-2 text-sm text-slate-400 max-w-xl mx-auto">
                自動辨識多筆訂單文字，精確擷取台北富邦銀行帳號（自動移除橫線與驗證位數）、金額、訂單編號與繳費期限。
            </p>
        </header>

        <!-- Main Grid Layout -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <!-- Left Panel: Input & Controls -->
            <div class="lg:col-span-5 flex flex-col space-y-6">
                <div class="bg-slate-900 rounded-2xl shadow-2xl shadow-black/60 border border-slate-800 p-6 flex flex-col h-full">
                    <div class="flex items-center justify-between mb-4">
                        <label for="orderInput" class="block text-sm font-semibold text-slate-200 flex items-center space-x-2">
                            <i class="fa-solid fa-paste text-rose-500"></i>
                            <span>貼上多筆訂單原始文字</span>
                        </label>
                        <button onclick="pasteFromClipboard()" class="text-xs font-medium text-rose-400 hover:text-rose-300 bg-rose-950/50 hover:bg-rose-900/50 border border-rose-800/60 px-3 py-1.5 rounded-lg transition duration-200 flex items-center space-x-1.5 cursor-pointer">
                            <i class="fa-regular fa-clipboard"></i>
                            <span>貼上文字</span>
                        </button>
                    </div>

                    <textarea id="orderInput" rows="10" placeholder="請在此貼上您的訂單資料，例如：
訂單 26110723129681，1 件 $20，mo_17，ATM $3
台北富邦銀行 30203-63195-48641-1，期限 2026/11/08 03:59
0911721101

訂單 26110723129682，2 件 $45，mo_18，ATM $3
台北富邦銀行 30203-12345-67890-2，期限 2026/11/09 12:00
0912345678" class="w-full rounded-xl bg-slate-950 border border-slate-700/80 p-4 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-rose-500 focus:border-transparent transition duration-200 resize-none font-mono"></textarea>

                    <div class="mt-4 flex space-x-3">
                        <button onclick="parseOrders()" class="flex-1 bg-rose-600 hover:bg-rose-700 text-white font-semibold py-3 px-4 rounded-xl shadow-lg shadow-rose-900/40 transition duration-200 flex items-center justify-center space-x-2">
                            <i class="fa-solid fa-wand-magic-sparkles"></i>
                            <span>立即解析與驗證</span>
                        </button>
                        <button onclick="clearAll()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold py-3 px-4 rounded-xl transition duration-200 flex items-center justify-center">
                            <i class="fa-solid fa-rotate-right"></i>
                        </button>
                    </div>
                </div>

                <!-- Tips / Guide Card -->
                <div class="bg-gradient-to-r from-slate-900 via-rose-950/40 to-slate-900 border border-slate-800/80 rounded-2xl p-6 text-slate-200 shadow-xl">
                    <h3 class="font-semibold text-sm flex items-center space-x-2 mb-2 text-rose-400">
                        <i class="fa-solid fa-shield-halved"></i>
                        <span>安全防呆與驗證機制</span>
                    </h3>
                    <p class="text-xs text-slate-400 leading-relaxed">
                        本工具會自動檢查台北富邦銀行後方的帳號長度與格式。若發現帳號位數異常或格式不符，會主動給予警告標籤，保障轉帳金額正確無誤。
                    </p>
                </div>
            </div>

            <!-- Right Panel: Output Results -->
            <div class="lg:col-span-7 flex flex-col">
                <div class="bg-slate-900 rounded-2xl shadow-2xl shadow-black/60 border border-slate-800 p-6 flex flex-col h-full min-h-[500px]">
                    
                    <div class="flex items-center justify-between pb-4 mb-4 border-b border-slate-800">
                        <h2 class="text-base font-bold text-white flex items-center space-x-2">
                            <i class="fa-solid fa-list-check text-rose-500"></i>
                            <span>解析結果與獨立卡片</span>
                        </h2>
                        <span id="resultCount" class="text-xs font-medium bg-slate-800 text-slate-300 px-2.5 py-1 rounded-full border border-slate-700">共 0 筆</span>
                    </div>

                    <!-- Results Container -->
                    <div id="resultsContainer" class="space-y-4 overflow-y-auto flex-1 pr-1">
                        <!-- Empty State -->
                        <div id="emptyState" class="h-full flex flex-col items-center justify-center text-center py-16 text-slate-500">
                            <div class="w-16 h-16 rounded-full bg-slate-800/60 flex items-center justify-center mb-3 text-slate-600">
                                <i class="fa-solid fa-file-lines text-2xl"></i>
                            </div>
                            <p class="text-sm font-medium text-slate-300">尚未解析任何資料</p>
                            <p class="text-xs text-slate-500 mt-1">請於左側輸入文字並點擊「立即解析與驗證」</p>
                        </div>
                    </div>

                </div>
            </div>

        </div>

    </div>

    <!-- JavaScript Logic -->
    <script>
        // 一鍵從剪貼簿貼上文字並自動執行解析
        async function pasteFromClipboard() {
            try {
                if (navigator.clipboard && navigator.clipboard.readText) {
                    const text = await navigator.clipboard.readText();
                    if (text && text.trim()) {
                        document.getElementById('orderInput').value = text;
                        showToast('已成功貼上剪貼簿內容', 'success');
                        parseOrders();
                        return;
                    }
                }
                showToast('剪貼簿無文字內容，請手動貼上 (Ctrl+V)', 'error');
            } catch (err) {
                // 若瀏覽器權限限制，提示使用者手動聚焦貼上
                const textarea = document.getElementById('orderInput');
                textarea.focus();
                showToast('請使用快捷鍵 Ctrl+V (或 Cmd+V) 進行貼上', 'error');
            }
        }

        // Clear all inputs and outputs
        function clearAll() {
            document.getElementById('orderInput').value = '';
            document.getElementById('resultsContainer').innerHTML = `
                <div id="emptyState" class="h-full flex flex-col items-center justify-center text-center py-16 text-slate-500">
                    <div class="w-16 h-16 rounded-full bg-slate-800/60 flex items-center justify-center mb-3 text-slate-600">
                        <i class="fa-solid fa-file-lines text-2xl"></i>
                    </div>
                    <p class="text-sm font-medium text-slate-300">尚未解析任何資料</p>
                    <p class="text-xs text-slate-500 mt-1">請於左側輸入文字並點擊「立即解析與驗證」</p>
                </div>
            `;
            document.getElementById('resultCount').innerText = '共 0 筆';
        }

        // Main Parser Function
        function parseOrders() {
            const rawText = document.getElementById('orderInput').value.trim();
            const container = document.getElementById('resultsContainer');
            
            if (!rawText) {
                container.innerHTML = `
                    <div id="emptyState" class="h-full flex flex-col items-center justify-center text-center py-16 text-slate-500">
                        <div class="w-16 h-16 rounded-full bg-slate-800/60 flex items-center justify-center mb-3 text-slate-600">
                            <i class="fa-solid fa-file-lines text-2xl"></i>
                        </div>
                        <p class="text-sm font-medium text-slate-300">請輸入有效的訂單文字</p>
                    </div>
                `;
                document.getElementById('resultCount').innerText = '共 0 筆';
                return;
            }

            // 正則表達式：直接尋找「台北富邦銀行」後面直到「期限」之前的內容
            // 模式支援各種空白、逗號、全半形符號
            const fubonRegex = /台北富邦銀行\s*([^，, \n\r]+?)(?=[，,\s]*期限)/g;
            
            // 另外以台北富邦銀行或訂單分割成多筆資料區塊
            // 同時支援：依「台北富邦銀行」或換行空行切分區塊
            const lines = rawText.split(/\n+/);
            let sections = [];
            let currentSection = [];

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;
                
                // 如果遇到新的訂單開頭，且當前區塊已有富邦銀行資訊，就開新區塊
                if (line.includes('訂單') && currentSection.some(l => l.includes('台北富邦銀行'))) {
                    sections.push(currentSection.join('\n'));
                    currentSection = [line];
                } else {
                    currentSection.push(line);
                }
            }
            if (currentSection.length > 0) {
                sections.push(currentSection.join('\n'));
            }

            let parsedResults = [];

            sections.forEach((section, index) => {
                // 1. 擷取「台北富邦銀行」後面的數字至「期限」之前
                // 支援格式如：台北富邦銀行 30203-63195-48641-1，期限 2026/11/08
                let rawAccount = '';
                const bankMatch = section.match(/台北富邦銀行\s*([^，,\n\r]+?)(?=[，,\s]*期限|$)/);
                
                if (bankMatch && bankMatch[1]) {
                    rawAccount = bankMatch[1].trim();
                } else {
                    // 若沒有「期限」兩字，尋找台北富邦銀行後面的數字字串
                    const fallbackMatch = section.match(/台北富邦銀行\s*([0-9\-]+)/);
                    if (fallbackMatch && fallbackMatch[1]) {
                        rawAccount = fallbackMatch[1].trim();
                    }
                }

                // 移除所有的 '-' 符號
                const cleanAccount = rawAccount.replace(/-/g, '').replace(/\s+/g, '');

                // 如果完全沒有富邦帳號特徵，略過此段或標記
                if (!rawAccount && !section.includes('台北富邦銀行')) {
                    return;
                }

                // 2. 擷取訂單編號
                const orderIdMatch = section.match(/訂單\s*([0-9A-Za-z]+)/);
                const orderId = orderIdMatch ? orderIdMatch[1] : `未具名訂單 #${index + 1}`;

                // 3. 擷取金額：只擷取 ATM 後面的金額數字（例如：ATM $3 -> 3）
                const atmAmountMatch = section.match(/ATM\s*\$?\s*([0-9,]+)/i);
                const amount = atmAmountMatch ? atmAmountMatch[1] : '無 ATM 金額';

                // 4. 擷取 09 開頭且共 10 碼的電話號碼（若無則忽略）
                const phoneMatch = section.match(/\b(09\d{8})\b/);
                const phone = phoneMatch ? phoneMatch[1] : null;

                // 5. 擷取期限：精準抓取日期與時間格式 (例如 2026/11/08 03:59)，排除後方電話
                const deadlineMatch = section.match(/期限\s*([0-9]{4}[\/\-][0-9]{1,2}[\/\-][0-9]{1,2}(?:\s+[0-9]{1,2}:[0-9]{1,2}(?::[0-9]{1,2})?)?)/);
                let deadline = '無期限資訊';
                if (deadlineMatch && deadlineMatch[1]) {
                    deadline = deadlineMatch[1].trim();
                } else {
                    // 備援抓取，並主動截斷或濾除後續可能跟隨的換行或 09 電話
                    const fallbackDeadline = section.match(/期限\s*([^\n\r]+)/);
                    if (fallbackDeadline && fallbackDeadline[1]) {
                        deadline = fallbackDeadline[1].replace(/09\d{8}.*$/, '').trim();
                    }
                }

                // 6. 帳號嚴格驗證機制
                let isValid = true;
                let validationMsg = '格式正確';
                
                if (!cleanAccount) {
                    isValid = false;
                    validationMsg = '未擷取到帳號';
                } else if (!/^\d+$/.test(cleanAccount)) {
                    isValid = false;
                    validationMsg = '含有非數字字元';
                } else if (cleanAccount.length === 16) {
                    // 台北富邦虛擬帳號大多為 16 碼 (例如 3020363195486411)
                    isValid = true;
                    validationMsg = '16碼 (富邦虛擬帳號驗證通過)';
                } else if (cleanAccount.length >= 10 && cleanAccount.length <= 16) {
                    isValid = true;
                    validationMsg = `${cleanAccount.length}碼 (長度符合標準)`;
                } else {
                    isValid = false;
                    validationMsg = `位數不正確 (${cleanAccount.length}碼，應為10~16碼)`;
                }

                parsedResults.push({
                    orderId,
                    phone,
                    amount,
                    rawAccount,
                    cleanAccount,
                    deadline,
                    isValid,
                    validationMsg
                });
            });

            document.getElementById('resultCount').innerText = `共 ${parsedResults.length} 筆`;

            if (parsedResults.length === 0) {
                container.innerHTML = `
                    <div class="h-full flex flex-col items-center justify-center text-center py-16 text-slate-500">
                        <i class="fa-solid fa-triangle-exclamation text-amber-400 text-3xl mb-2"></i>
                        <p class="text-sm font-semibold text-slate-300">找不到包含「台北富邦銀行」的資料</p>
                        <p class="text-xs text-slate-500 mt-1">請確認內容是否包含「台北富邦銀行 帳號，期限 ...」</p>
                    </div>
                `;
                return;
            }

            // 渲染卡片結果
            let html = '';
            parsedResults.forEach((item, idx) => {
                const cardId = `card-item-${idx}`;
                html += `
                    <div id="${cardId}" class="bg-slate-900 rounded-xl border ${item.isValid ? 'border-slate-800' : 'border-amber-500/50 bg-amber-950/10'} p-5 shadow-lg transition duration-200">
                        
                        <!-- 標題、電話與金額 -->
                        <div class="flex items-start justify-between pb-3 mb-3 border-b border-slate-800">
                            <div>
                                ${item.phone ? `
                                    <div class="inline-flex items-center space-x-1.5 text-sm font-semibold bg-sky-950/70 text-sky-300 border border-sky-800 px-2.5 py-1 rounded-lg mb-2 shadow-sm">
                                        <i class="fa-solid fa-phone text-sky-400 text-xs"></i>
                                        <span class="font-mono tracking-wider">${escapeHtml(item.phone)}</span>
                                    </div>
                                ` : ''}
                                <div class="flex items-center space-x-2">
                                    <span class="card-badge w-6 h-6 rounded-md bg-slate-800 text-slate-300 border border-slate-700 font-bold text-xs flex items-center justify-center">${idx + 1}</span>
                                    <span class="font-bold text-slate-100 text-sm">訂單：${escapeHtml(item.orderId)}</span>
                                </div>
                            </div>
                            <div class="flex items-center space-x-2">
                                <span id="copied-badge-${idx}" class="hidden text-xs font-bold px-2.5 py-0.5 bg-rose-600 text-white border border-rose-500 rounded-full flex items-center space-x-1 shadow-sm shadow-rose-900/50">
                                    <i class="fa-solid fa-check"></i>
                                    <span>已處理</span>
                                </span>
                                <span class="text-xs font-semibold px-2.5 py-1 bg-emerald-950/70 text-emerald-300 border border-emerald-800/70 rounded-lg">
                                    $ ${escapeHtml(item.amount)}
                                </span>
                            </div>
                        </div>

                        <!-- 帳號與複製區塊 -->
                        <div id="account-box-${idx}" class="account-box bg-slate-950 p-3.5 rounded-xl border border-slate-800 flex flex-col sm:flex-row sm:items-center justify-between gap-3 transition-colors duration-200">
                            <div class="space-y-1">
                                <div class="flex items-center space-x-2">
                                    <span class="text-xs font-semibold text-slate-400">台北富邦銀行 (已除橫線)：</span>
                                    <span class="text-[11px] px-2 py-0.5 rounded-full font-medium ${item.isValid ? 'bg-emerald-950/80 text-emerald-300 border border-emerald-800' : 'bg-rose-950/80 text-rose-300 border border-rose-800'}">
                                        ${escapeHtml(item.validationMsg)}
                                    </span>
                                </div>
                                <div id="account-text-${idx}" class="font-mono text-xl font-bold tracking-wider ${item.isValid ? 'text-indigo-400' : 'text-amber-400'} transition-colors duration-200">
                                    ${escapeHtml(item.cleanAccount || '無帳號')}
                                </div>
                                <div class="text-[11px] text-slate-500">原始格式：${escapeHtml(item.rawAccount || '無')}</div>
                            </div>
                            
                            <div>
                                ${item.cleanAccount ? `
                                    <button id="copy-btn-${idx}" onclick="copyToClipboard('${item.cleanAccount}', '${item.cleanAccount}', ${idx})" class="w-full sm:w-auto bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-100 border border-slate-700 font-medium text-xs px-4 py-2.5 rounded-xl shadow-md transition duration-150 flex items-center justify-center space-x-2 cursor-pointer">
                                        <i class="fa-regular fa-copy"></i>
                                        <span>點一下複製帳號</span>
                                    </button>
                                ` : ''}
                            </div>
                        </div>

                        <!-- 期限資訊 -->
                        <div class="mt-3 flex items-center justify-between text-xs text-slate-400 pt-2 border-t border-slate-800/80">
                            <span class="flex items-center space-x-1">
                                <i class="fa-regular fa-calendar-check text-slate-500"></i>
                                <span>繳費期限：<strong class="text-slate-200">${escapeHtml(item.deadline)}</strong></span>
                            </span>
                        </div>

                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // Copy function using execCommand fallback & Toast notification
        function copyToClipboard(text, label, index) {
            if (!text) return;
            
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.opacity = "0";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();

            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    showToast(`已複製帳號：${label}`, 'success');
                    markAsCopied(index);
                } else {
                    showToast('複製失敗，請手動複製', 'error');
                }
            } catch (err) {
                showToast('複製失敗', 'error');
            }

            document.body.removeChild(textArea);
        }

        // 標記該項目為已複製 (變換顏色樣式為紅色)
        function markAsCopied(index) {
            if (index === undefined || index === null) return;
            
            // 1. 更新按鈕樣式為紅色背景與已複製圖示
            const btn = document.getElementById(`copy-btn-${index}`);
            if (btn) {
                btn.className = "w-full sm:w-auto bg-rose-600 hover:bg-rose-700 active:scale-95 text-white border border-rose-500 font-medium text-xs px-4 py-2.5 rounded-xl shadow-lg shadow-rose-950 transition duration-150 flex items-center justify-center space-x-2 cursor-pointer";
                btn.innerHTML = `<i class="fa-solid fa-check"></i><span>已複製</span>`;
            }

            // 2. 更新帳號背景區塊（移除生硬紅外框，改為乾淨的微暗紅底色）
            const accountBox = document.getElementById(`account-box-${index}`);
            if (accountBox) {
                accountBox.classList.remove('bg-slate-950');
                accountBox.classList.add('bg-rose-950/25');
            }

            // 3. 更新帳號文字為亮紅色
            const accountText = document.getElementById(`account-text-${index}`);
            if (accountText) {
                accountText.classList.remove('text-indigo-400');
                accountText.classList.add('text-rose-400');
            }

            // 4. 顯示右上角紅色「已處理」徽章
            const badge = document.getElementById(`copied-badge-${index}`);
            if (badge) {
                badge.classList.remove('hidden');
            }

            // 5. 將原本容易看起來像破圖的整張卡片外圈紅框移除
            const card = document.getElementById(`card-item-${index}`);
            if (card) {
                card.classList.remove('ring-1', 'ring-rose-500');
            }
        }

        // Toast Notification System
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            const bgClass = type === 'success' ? 'bg-slate-900 text-slate-100 border border-slate-700 shadow-rose-950/30' : 'bg-rose-700 text-white';
            const icon = type === 'success' ? 'fa-circle-check text-rose-400' : 'fa-circle-exclamation text-white';

            toast.className = `pointer-events-auto flex items-center space-x-2 px-4 py-3 rounded-xl shadow-2xl text-xs font-medium transform translate-y-2 opacity-0 transition-all duration-300 ${bgClass}`;
            toast.innerHTML = `
                <i class="fa-solid ${icon} text-sm"></i>
                <span>${message}</span>
            `;

            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => {
                    toast.remove();
                }, 300);
            }, 2500);
        }

        // HTML Escape helper
        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
